services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-remindbot}
      POSTGRES_USER: ${DATABASE_USER:-bot}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432" # only from this machine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Бот в контейнере — для сервера (`make deploy`). Локально бот запускается через `make run`,
  # а `make db-up` поднимает только базу.
  bot:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Настройки — из того же .env, что и локально; адрес базы и пути к секретам в контейнере свои.
    env_file: .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      TELEGRAM_TOKEN_FILE: /run/secrets/telegram_token
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      YOUGILE_API_KEY_FILE: /run/secrets/yougile_api_key
      HEALTH_ADDR: 127.0.0.1:8081
      # Копия лога в файл на сервере (/opt/remindbot/logs): переживает пересоздание контейнера при
      # деплое. Ротация — в самом боте: 10 МБ на файл, 5 старых копий. Папка должна принадлежать uid 10001.
      LOG_FILE: /logs/remindbot.log
    volumes:
      - ./logs:/logs
    secrets:
      - telegram_token
      - postgres_password
      - yougile_api_key
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 3
    stop_grace_period: 20s # бот ждёт до 15 с, пока доработают задачи из очереди

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  telegram_token:
    file: ./secrets/telegram_token
  yougile_api_key:
    file: ./secrets/yougile_api_key

volumes:
  pgdata:
